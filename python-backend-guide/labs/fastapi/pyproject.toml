[project]
name = "python-backend-guide-fastapi"
version = "0.1.0"
description = "FastAPI and SQLAlchemy lab for Python Backend Interview Guide"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "starlette>=1.10.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "sqlmodel>=0.0.48",
    "psycopg>=3.3.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "httpx>=0.28.1",
    "anyio>=4.16.0",
    "testcontainers>=4.15.0",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: integration tests requiring a running Docker daemon (deselected when Docker is absent)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
