[project]
name = "python-backend-guide-django"
version = "0.1.0"
description = "Django and DRF lab for Python Backend Interview Guide"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "channels>=4.3.2",
    "psycopg>=3.3.6",
    "redis>=8.1.0",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-asyncio>=1.4.1.post1",
    "factory-boy>=3.3.3",
    "testcontainers>=4.15.0",
    "django-stubs>=6.1.2",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "docker: integration tests requiring a running Docker daemon (deselected when Docker is absent)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
warn_unused_configs = true

[tool.django-stubs]
django_settings_module = "config.settings"
