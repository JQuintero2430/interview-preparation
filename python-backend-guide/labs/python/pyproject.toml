[project]
name = "python-backend-guide-python"
version = "0.1.0"
description = "Python language and concurrency lab for Python Backend Interview Guide"
requires-python = ">=3.13"
dependencies = [
    "redis>=8.1.0",
    "pymongo>=4.19.0",
    "motor>=3.7.1",
    "cassandra-driver>=3.30.1",
    "celery>=5.6.3",
    "rq>=3.0.0",
    "dramatiq>=2.2.1",
    "confluent-kafka>=2.16.1",
    "aiokafka>=0.15.0",
    "kafka-python>=3.0.12",
    "grpcio>=1.85.1",
    "strawberry-graphql>=0.339.1",
    "opentelemetry-sdk>=1.45.2",
    "py-spy>=0.4.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "anyio>=4.16.0",
    "testcontainers>=4.15.0",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: integration tests requiring a running Docker daemon (deselected when Docker is absent)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
