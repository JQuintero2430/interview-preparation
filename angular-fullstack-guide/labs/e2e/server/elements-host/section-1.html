<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>m37-rating host page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <h1>Plain HTML host</h1>
    <m37-rating value="3"></m37-rating>
    <p id="log"></p>
    <script>
      document.querySelector('m37-rating').addEventListener('rated', (event) => {
        document.getElementById('log').textContent = 'rated ' + event.detail;
      });
    </script>
    <script type="module" src="/widgets/main.js"></script>
  </body>
</html>
